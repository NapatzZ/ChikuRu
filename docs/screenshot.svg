  <text x="16" y="54" fill="#ffd36e" font-size="16" font-weight="700">x3</text>
  <rect x="16" y="60" width="60" height="4" fill="#ffd36e" opacity="0.25"/>
  <rect x="16" y="60" width="38" height="4" fill="#ffd36e"/>
  <text x="360" y="30" fill="#ffffff" fill-opacity="0.7" font-size="15" font-weight="600" text-anchor="middle">WAVE 3</text>
  <text x="704" y="34" fill="#ff5c8a" font-size="22" text-anchor="end">&#9829; &#9829; &#9829;</text>

  <!-- enemies -->
